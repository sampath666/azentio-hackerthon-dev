spring.application.name=development

spring.datasource.url=jdbc:postgresql://localhost:5432/development
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

sentinel.rules.large-transaction-threshold-inr=${SENTINEL_LARGE_THRESHOLD_INR:10000}
sentinel.rules.structuring-minimum=${SENTINEL_STRUCTURING_MINIMUM:3}
sentinel.rules.structuring-lower-inr=${SENTINEL_STRUCTURING_LOWER_INR:9000}
sentinel.rules.structuring-upper-inr=${SENTINEL_STRUCTURING_UPPER_INR:10000}
sentinel.rules.structuring-window-hours=${SENTINEL_STRUCTURING_WINDOW_HOURS:24}
sentinel.rules.rapid-movement-window-hours=${SENTINEL_RAPID_WINDOW_HOURS:48}
sentinel.rules.rapid-movement-percentage=${SENTINEL_RAPID_PERCENTAGE:0.80}
sentinel.rules.behavior-window-days=${SENTINEL_BEHAVIOR_DAYS:90}
sentinel.rules.behavior-multiplier=${SENTINEL_BEHAVIOR_MULTIPLIER:3}
sentinel.rules.high-risk-jurisdictions=${SENTINEL_HIGH_RISK_JURISDICTIONS:AF,IR,KP,MM,RU,SY}
sentinel.exchange-rates-inr=${SENTINEL_EXCHANGE_RATES_INR:INR=1,USD=83,EUR=90,GBP=105}

sentinel.security.user=${SENTINEL_API_USER:}
sentinel.security.password=${SENTINEL_API_PASSWORD:}